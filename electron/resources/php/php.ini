; PHP 8.4.0 NTS x64 — configured for Laravel + Postgres
; Replaces the original Herd Lite static-build php.ini

[PHP]
variables_order = "GPCS"
memory_limit = 512M
max_execution_time = 120
post_max_size = 64M
upload_max_filesize = 64M
date.timezone = UTC

extension_dir = "ext"

; Core extensions required by Laravel
; bcmath is statically built-in on this Windows build (no php_bcmath.dll shipped)
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=exif
extension=openssl
extension=pdo_mysql
extension=pdo_pgsql
extension=pdo_sqlite
extension=pgsql
extension=sodium
extension=sqlite3
extension=zip

[opcache]
zend_extension=opcache
opcache.enable=1
; opcache.enable_cli disabled — Windows ASLR makes "Opcode handlers are
; unusable" fatal in CLI (which `artisan serve` runs under).
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.revalidate_freq=0
opcache.validate_timestamps=1
