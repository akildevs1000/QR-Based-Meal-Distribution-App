; PHP 8.4.0 NTS x64 — configured for Laravel + Postgres
; Replaces the original Herd Lite static-build php.ini

[PHP]
variables_order = "GPCS"
memory_limit = 512M
max_execution_time = 120
post_max_size = 64M
upload_max_filesize = 64M
date.timezone = Asia/Dubai

extension_dir = "ext"

; Core extensions required by Laravel
; bcmath is statically built-in on this Windows build (no php_bcmath.dll shipped)
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=exif
extension=openssl
extension=pdo_mysql
extension=pdo_pgsql
extension=pdo_sqlite
extension=pgsql
extension=sodium
extension=sqlite3
extension=zip

; OPcache is not loaded — Windows ASLR causes "Opcode handlers are unusable"
; fatal even when opcache.enable_cli=0 because PHP 8.4 JIT initializes during
; extension load. We don't need OPcache for `artisan serve` anyway.
; [opcache]
; zend_extension=opcache
; opcache.enable=1
; opcache.enable_cli=0
; opcache.jit=0
