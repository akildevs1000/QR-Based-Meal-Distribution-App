<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Meal Distribution App</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: #0b1220; border-bottom: 1px solid #1e293b;
    flex-wrap: wrap;
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  header .dot.on   { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  header .dot.off  { background: #ef4444; }
  header .dot.busy { background: #eab308; box-shadow: 0 0 8px #eab308; }
  header #state { font-weight: 500; }
  header .spacer { flex: 1; }
  header .urls { color: #94a3b8; font-size: 12px; }
  header button {
    padding: 5px 10px; border-radius: 4px; border: 1px solid #1e293b;
    background: #1e293b; color: #e2e8f0; cursor: pointer; font: inherit;
    transition: filter 0.1s;
  }
  header button.primary { background: #2563eb; border-color: #2563eb; }
  header button.danger  { background: #b91c1c; border-color: #b91c1c; }
  header button.ghost   { background: transparent; }
  header button:hover { filter: brightness(1.15); }
  header button:disabled { opacity: 0.5; cursor: not-allowed; }
  header input[type="search"] {
    background: #0b1220; border: 1px solid #1e293b; border-radius: 4px;
    color: #e2e8f0; font: inherit; padding: 5px 10px; width: 220px;
  }
  header input[type="search"]:focus { outline: none; border-color: #2563eb; }
  pre .hl { background: #facc15; color: #0f172a; border-radius: 2px; }

  /* Date-range modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: #0b1220; border: 1px solid #1e293b; border-radius: 8px;
    padding: 20px; width: 360px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .modal h2 { margin: 0 0 4px; font-size: 16px; }
  .modal p  { margin: 0 0 14px; color: #94a3b8; font-size: 12px; }
  .modal label { display: block; font-size: 12px; color: #cbd5e1; margin: 10px 0 4px; }
  .modal input[type="date"] {
    width: 100%; padding: 6px 8px; background: #0f172a;
    border: 1px solid #1e293b; border-radius: 4px;
    color: #e2e8f0; font: inherit; color-scheme: dark;
  }
  .modal input[type="date"]:focus { outline: none; border-color: #2563eb; }
  .modal .err { color: #fca5a5; font-size: 12px; margin-top: 8px; min-height: 16px; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal button {
    padding: 6px 12px; border-radius: 4px; border: 1px solid #1e293b;
    background: #1e293b; color: #e2e8f0; cursor: pointer; font: inherit;
  }
  .modal button.primary { background: #2563eb; border-color: #2563eb; }
  .modal button:hover { filter: brightness(1.15); }
  pre {
    margin: 0; padding: 12px 14px; height: calc(100% - 50px); overflow: auto;
    font: 12px/1.6 "Cascadia Code", Consolas, "Courier New", monospace;
    color: #cbd5e1; white-space: pre-wrap; word-break: break-word;
  }
  pre .err { color: #fca5a5; }
  pre .info { color: #93c5fd; }
  pre .ts { color: #64748b; margin-right: 6px; }
</style>
</head>
<body>
  <header>
    <span class="dot off" id="dot"></span>
    <span id="state">Stopped</span>
    <span class="spacer"></span>
    <button id="startBtn" class="primary" hidden>Start</button>
    <button id="stopBtn" class="danger" hidden>Stop</button>
    <button id="restartBtn">Restart</button>
    <button id="openAdminBtn" class="primary">Open Admin</button>
    <button id="settingsBtn" class="ghost" title="Database settings">Settings</button>
    <button id="downloadLogsBtn" class="ghost" title="Download server logs">Download Server Logs</button>
    <input type="search" id="searchInput" placeholder="Search logs… (Ctrl+F)" />
    <span class="urls" id="urls"></span>
  </header>
  <pre id="log"></pre>

  <div class="modal-backdrop" id="downloadModal">
    <div class="modal">
      <h2>Download Server Logs</h2>
      <p>Choose a date range. Only logs within this range will be saved.</p>
      <label for="dateFrom">From</label>
      <input type="date" id="dateFrom" />
      <label for="dateTo">To</label>
      <input type="date" id="dateTo" />
      <div class="err" id="dateErr"></div>
      <div class="row">
        <button id="downloadCancelBtn">Cancel</button>
        <button id="downloadConfirmBtn" class="primary">Download</button>
      </div>
    </div>
  </div>
<script>
  const log = document.getElementById('log')
  const dot = document.getElementById('dot')
  const state = document.getElementById('state')
  const urls = document.getElementById('urls')
  const startBtn = document.getElementById('startBtn')
  const stopBtn = document.getElementById('stopBtn')
  const restartBtn = document.getElementById('restartBtn')
  const openAdminBtn = document.getElementById('openAdminBtn')
  const settingsBtn = document.getElementById('settingsBtn')
  const searchInput = document.getElementById('searchInput')

  // Apply current search filter to a single row — hides it if the query is set
  // and the row doesn't match. Also wraps matches in a <mark>-style span.
  const applyFilterToRow = (div) => {
    const q = searchInput.value.trim().toLowerCase()
    if (!q) {
      div.hidden = false
      // Strip any previous highlights.
      div.querySelectorAll('.hl').forEach(el => {
        const t = document.createTextNode(el.textContent)
        el.replaceWith(t)
      })
      return
    }
    const text = div.textContent.toLowerCase()
    if (!text.includes(q)) { div.hidden = true; return }
    div.hidden = false
    // Re-highlight: walk children and rewrite text nodes containing matches.
    div.querySelectorAll('.hl').forEach(el => {
      const t = document.createTextNode(el.textContent)
      el.replaceWith(t)
    })
    highlightInNode(div, q)
  }

  const highlightInNode = (root, q) => {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null)
    const nodes = []
    while (walker.nextNode()) nodes.push(walker.currentNode)
    for (const node of nodes) {
      const lower = node.textContent.toLowerCase()
      let i = lower.indexOf(q)
      if (i === -1) continue
      const frag = document.createDocumentFragment()
      let last = 0
      while (i !== -1) {
        if (i > last) frag.appendChild(document.createTextNode(node.textContent.slice(last, i)))
        const mark = document.createElement('span')
        mark.className = 'hl'
        mark.textContent = node.textContent.slice(i, i + q.length)
        frag.appendChild(mark)
        last = i + q.length
        i = lower.indexOf(q, last)
      }
      if (last < node.textContent.length) frag.appendChild(document.createTextNode(node.textContent.slice(last)))
      node.replaceWith(frag)
    }
  }

  const append = (line) => {
    const div = document.createElement('div')
    // Pull out the [HH:MM:SS] prefix and style it dim if present.
    const m = String(line).match(/^\[(\d{2}:\d{2}:\d{2})\]\s*(.*)$/)
    if (m) {
      const ts = document.createElement('span')
      ts.className = 'ts'
      ts.textContent = `[${m[1]}]`
      const body = document.createElement('span')
      body.textContent = m[2]
      if (/error|fail|cannot/i.test(m[2])) body.className = 'err'
      // Anything emitted by the supervisor processes — `(server)`, `(worker)`,
      // `(cron)` — is informational unless an error pattern matched above.
      else if (/^•/.test(m[2]) || /^\(\w+\)/.test(m[2]) || /Ready|Starting|Stopped|Restarting/i.test(m[2])) body.className = 'info'
      div.appendChild(ts)
      div.appendChild(body)
    } else {
      div.textContent = line
    }
    log.appendChild(div)
    while (log.childNodes.length > 2000) log.removeChild(log.firstChild)
    applyFilterToRow(div)
    if (!div.hidden) log.scrollTop = log.scrollHeight
  }

  searchInput.addEventListener('input', () => {
    Array.from(log.children).forEach(applyFilterToRow)
  })
  // Ctrl+F → focus search.
  document.addEventListener('keydown', (ev) => {
    if (ev.ctrlKey && ev.key.toLowerCase() === 'f') {
      ev.preventDefault()
      searchInput.focus()
      searchInput.select()
    }
    if (ev.key === 'Escape' && document.activeElement === searchInput) {
      searchInput.value = ''
      Array.from(log.children).forEach(applyFilterToRow)
      searchInput.blur()
    }
  })

  async function refreshStatus() {
    const s = await window.logsApi.status()
    if (s.running) {
      dot.className = 'dot on'
      state.textContent = `Running on port ${s.port}`
    } else if (s.starting) {
      dot.className = 'dot busy'
      state.textContent = 'Starting…'
    } else {
      dot.className = 'dot off'
      state.textContent = 'Stopped'
    }
    startBtn.hidden = s.running || s.starting
    stopBtn.hidden = !s.running && !s.starting
    restartBtn.disabled = !s.running
    openAdminBtn.disabled = !s.running
    urls.textContent = (s.ips || []).map(ip => `http://${ip}:${s.port}`).join('   ')
  }

  startBtn.addEventListener('click', async () => {
    await window.logsApi.start()
    refreshStatus()
  })
  stopBtn.addEventListener('click', async () => {
    await window.logsApi.stop()
    refreshStatus()
  })
  restartBtn.addEventListener('click', async () => {
    await window.logsApi.restart()
    refreshStatus()
  })
  openAdminBtn.addEventListener('click', () => window.logsApi.openAdmin())
  settingsBtn.addEventListener('click', () => window.logsApi.openSetup())

  // ---------- Download server logs (date-range modal) ----------
  const downloadModal = document.getElementById('downloadModal')
  const dateFrom = document.getElementById('dateFrom')
  const dateTo = document.getElementById('dateTo')
  const dateErr = document.getElementById('dateErr')

  const todayStr = () => new Date().toISOString().slice(0, 10)
  const sysLog = (msg) => append(`[${new Date().toTimeString().slice(0, 8)}] (system) ${msg}`)

  document.getElementById('downloadLogsBtn').addEventListener('click', async () => {
    const dates = await window.logsApi.availableLogDates()
    if (!dates || dates.length === 0) {
      sysLog('no log files yet — nothing to download.')
      return
    }
    // Bound the picker to the available range; default to the full range.
    const min = dates[0]
    const max = dates[dates.length - 1]
    dateFrom.min = min; dateFrom.max = max; dateFrom.value = min
    dateTo.min = min;   dateTo.max = max;   dateTo.value = max
    dateErr.textContent = ''
    downloadModal.classList.add('show')
    setTimeout(() => dateFrom.focus(), 50)
  })

  const closeModal = () => downloadModal.classList.remove('show')
  document.getElementById('downloadCancelBtn').addEventListener('click', closeModal)
  downloadModal.addEventListener('click', (ev) => { if (ev.target === downloadModal) closeModal() })
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && downloadModal.classList.contains('show')) closeModal()
  })

  document.getElementById('downloadConfirmBtn').addEventListener('click', async () => {
    const from = dateFrom.value
    const to = dateTo.value
    if (!from || !to) { dateErr.textContent = 'Pick both dates.'; return }
    if (from > to)    { dateErr.textContent = '"From" must be before or equal to "To".'; return }
    dateErr.textContent = ''
    const r = await window.logsApi.downloadLogs({ from, to })
    if (r?.ok) {
      sysLog(`saved ${r.count} day(s) of logs to ${r.path}`)
      closeModal()
    } else if (r && !r.canceled) {
      dateErr.textContent = r.error || 'Download failed.'
    } else if (r?.canceled) {
      // User cancelled the OS save dialog — keep our modal open in case they retry.
    }
  })

  ;(async () => {
    const initial = await window.logsApi.initial()
    initial.forEach(append)
    await refreshStatus()
    setInterval(refreshStatus, 2000)
  })()

  window.logsApi.onLine(append)
</script>
</body>
</html>
