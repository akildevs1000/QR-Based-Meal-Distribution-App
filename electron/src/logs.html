<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>QR Meal Server</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: #0b1220; border-bottom: 1px solid #1e293b;
    flex-wrap: wrap;
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  header .dot.on   { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  header .dot.off  { background: #ef4444; }
  header .dot.busy { background: #eab308; box-shadow: 0 0 8px #eab308; }
  header #state { font-weight: 500; }
  header .spacer { flex: 1; }
  header .urls { color: #94a3b8; font-size: 12px; }
  header button {
    padding: 5px 10px; border-radius: 4px; border: 1px solid #1e293b;
    background: #1e293b; color: #e2e8f0; cursor: pointer; font: inherit;
    transition: filter 0.1s;
  }
  header button.primary { background: #2563eb; border-color: #2563eb; }
  header button.danger  { background: #b91c1c; border-color: #b91c1c; }
  header button.ghost   { background: transparent; }
  header button:hover { filter: brightness(1.15); }
  header button:disabled { opacity: 0.5; cursor: not-allowed; }
  pre {
    margin: 0; padding: 12px 14px; height: calc(100% - 50px); overflow: auto;
    font: 12px/1.6 "Cascadia Code", Consolas, "Courier New", monospace;
    color: #cbd5e1; white-space: pre-wrap; word-break: break-word;
  }
  pre .err { color: #fca5a5; }
  pre .info { color: #93c5fd; }
  pre .ts { color: #64748b; margin-right: 6px; }
</style>
</head>
<body>
  <header>
    <span class="dot off" id="dot"></span>
    <span id="state">Stopped</span>
    <span class="spacer"></span>
    <button id="startBtn" class="primary" hidden>Start</button>
    <button id="stopBtn" class="danger" hidden>Stop</button>
    <button id="restartBtn">Restart</button>
    <button id="openAdminBtn" class="primary">Open Admin</button>
    <button id="settingsBtn" class="ghost" title="Database settings">Settings</button>
    <span class="urls" id="urls"></span>
  </header>
  <pre id="log"></pre>
<script>
  const log = document.getElementById('log')
  const dot = document.getElementById('dot')
  const state = document.getElementById('state')
  const urls = document.getElementById('urls')
  const startBtn = document.getElementById('startBtn')
  const stopBtn = document.getElementById('stopBtn')
  const restartBtn = document.getElementById('restartBtn')
  const openAdminBtn = document.getElementById('openAdminBtn')
  const settingsBtn = document.getElementById('settingsBtn')

  const append = (line) => {
    const div = document.createElement('div')
    // Pull out the [HH:MM:SS] prefix and style it dim if present.
    const m = String(line).match(/^\[(\d{2}:\d{2}:\d{2})\]\s*(.*)$/)
    if (m) {
      const ts = document.createElement('span')
      ts.className = 'ts'
      ts.textContent = `[${m[1]}]`
      const body = document.createElement('span')
      body.textContent = m[2]
      if (/error|fail|cannot/i.test(m[2])) body.className = 'err'
      else if (/^•/.test(m[2]) || /Ready|Starting|Stopped|Restarting/i.test(m[2])) body.className = 'info'
      div.appendChild(ts)
      div.appendChild(body)
    } else {
      div.textContent = line
    }
    log.appendChild(div)
    while (log.childNodes.length > 2000) log.removeChild(log.firstChild)
    log.scrollTop = log.scrollHeight
  }

  async function refreshStatus() {
    const s = await window.logsApi.status()
    if (s.running) {
      dot.className = 'dot on'
      state.textContent = `Running on port ${s.port}`
    } else if (s.starting) {
      dot.className = 'dot busy'
      state.textContent = 'Starting…'
    } else {
      dot.className = 'dot off'
      state.textContent = 'Stopped'
    }
    startBtn.hidden = s.running || s.starting
    stopBtn.hidden = !s.running && !s.starting
    restartBtn.disabled = !s.running
    openAdminBtn.disabled = !s.running
    urls.textContent = (s.ips || []).map(ip => `http://${ip}:${s.port}`).join('   ')
  }

  startBtn.addEventListener('click', async () => {
    await window.logsApi.start()
    refreshStatus()
  })
  stopBtn.addEventListener('click', async () => {
    await window.logsApi.stop()
    refreshStatus()
  })
  restartBtn.addEventListener('click', async () => {
    await window.logsApi.restart()
    refreshStatus()
  })
  openAdminBtn.addEventListener('click', () => window.logsApi.openAdmin())
  settingsBtn.addEventListener('click', () => window.logsApi.openSetup())

  ;(async () => {
    const initial = await window.logsApi.initial()
    initial.forEach(append)
    await refreshStatus()
    setInterval(refreshStatus, 2000)
  })()

  window.logsApi.onLine(append)
</script>
</body>
</html>
